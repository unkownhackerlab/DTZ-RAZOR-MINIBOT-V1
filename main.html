<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTZ RAZOR MD BOT</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
}

/* ===== Background Video ===== */
video.bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
  filter:brightness(0.4);
}

/* ===== Center ===== */
.container{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* ===== Box ===== */
.box{
  width:350px;
  padding:30px;
  background:rgba(0,0,0,0.8);
  border-radius:20px;
  text-align:center;
  position:relative;
  backdrop-filter:blur(5px);
}

/* RGB Border */
.box::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:22px;
  background:linear-gradient(90deg,#00ffff,#ff00ff,#00ff00,#00ffff);
  z-index:-1;
  filter:blur(10px);
  animation:borderRGB 4s linear infinite;
}

@keyframes borderRGB{
  0%{filter:blur(8px);}
  50%{filter:blur(15px);}
  100%{filter:blur(8px);}
}

/* ===== RGB TITLE ===== */
.rgb-text{
  font-size:20px;
  font-weight:bold;
  animation:rgbTitle 3s linear infinite;
}

@keyframes rgbTitle{
  0%{color:#00ffff;text-shadow:0 0 5px #00ffff;}
  33%{color:#ff00ff;text-shadow:0 0 5px #ff00ff;}
  66%{color:#00ff00;text-shadow:0 0 5px #00ff00;}
  100%{color:#00ffff;text-shadow:0 0 5px #00ffff;}
}

h6{
  color:#8ffcff;
  margin-top:10px;
  font-size:12px;
}

/* ===== Input ===== */
.input-container{
  display:flex;
  margin-top:20px;
}

.input-container input{
  width:70%;
  height:45px;
  border:none;
  outline:none;
  border-radius:10px 0 0 10px;
  padding-left:15px;
  font-size:16px;
  background:#fff;
}

.input-container button{
  width:30%;
  height:45px;
  border:none;
  border-radius:0 10px 10px 0;
  background:linear-gradient(90deg,#00ffff,#00ffcc);
  font-weight:bold;
  cursor:pointer;
  color:#000;
  font-size:14px;
}

.input-container button:hover{
  background:linear-gradient(90deg,#00ffcc,#00ffff);
  transform:scale(1.02);
}

/* ===== Result Box ===== */
#pair{
  margin-top:20px;
  padding:10px;
  background:rgba(0,0,0,0.5);
  border-radius:10px;
}

#copy{
  cursor:pointer;
  padding:8px;
  background:rgba(255,255,255,0.1);
  border-radius:8px;
  transition:0.3s;
}

#copy:hover{
  background:rgba(255,255,255,0.2);
}

/* ===== Loading Animation ===== */
.loading{
  display:inline-block;
  width:20px;
  height:20px;
  border:3px solid #00ffff;
  border-radius:50%;
  border-top-color:transparent;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<!-- Background Video -->
<video class="bg-video" autoplay muted loop>
  <source src="https://files.catbox.moe/dlcamg.mp4" type="video/mp4">
</video>

<div class="container">
  <div class="box">
    <i class="fa fa-robot" style="color:#00ffff;font-size:28px;margin-bottom:10px;display:block;"></i>

    <div class="rgb-text">DTZ RAZOR MD BOT</div>
    <h6>⚡ FAST • RELIABLE • SECURE ⚡</h6>
    <h6>📢 Enter your WhatsApp number</h6>

    <div class="input-container">
      <input type="tel" id="number" placeholder="2547xxxxxxx">
      <button id="submit">PAIR NOW</button>
    </div>

    <main id="pair"></main>
  </div>
</div>

<script>
let a=document.getElementById("pair");
let b=document.getElementById("submit");
let c=document.getElementById("number");

b.addEventListener("click",async(e)=>{
  e.preventDefault();
  if(!c.value){
    a.innerHTML='<span style="color:#ff6b6b">❌ Enter your WhatsApp number</span>';
    return;
  }
  
  let number=c.value.replace(/[^0-9]/g,"");
  if(number.length<10){
    a.innerHTML='<span style="color:#ff6b6b">❌ Invalid number! Must be 10-15 digits</span>';
    return;
  }
  
  // Show loading
  a.innerHTML='<div class="loading"></div><span style="color:white;margin-left:10px;"> Generating pairing code...</span>';
  
  try {
    // Use the correct API endpoint
    const response = await fetch('/api/pair', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ number: number })
    });
    
    const data = await response.json();
    
    if(data.success && data.pairingCode){
      a.innerHTML = `
        <div id="copy" onclick="Copy()" style="color:#00ff00;font-weight:bold;padding:10px;">
          ✅ PAIRING CODE GENERATED!<br>
          <span style="color:#00ffff;font-size:24px;display:block;margin:10px 0;">${data.pairingCode}</span>
          <span style="color:#fff;font-size:12px;">👇 Click to copy code 👆</span>
        </div>
        <div style="color:#8ffcff;font-size:11px;margin-top:10px;">
          📌 Open WhatsApp → Linked Devices → Link with Code
        </div>
      `;
    } else if(data.status === 'already_connected'){
      a.innerHTML='<span style="color:#ffaa00;">⚠️ This number is already connected!</span>';
    } else {
      a.innerHTML=`<span style="color:#ff6b6b;">❌ ${data.error || data.message || 'Failed to generate code'}</span>`;
    }
  } catch(err){
    console.error(err);
    a.innerHTML='<span style="color:#ff6b6b;">❌ Server error. Please try again later.</span>';
  }
});

async function Copy(){
  let obj=document.getElementById("copy");
  let codeText = obj.innerText.match(/\d{8}/);
  if(codeText){
    await navigator.clipboard.writeText(codeText[0]);
    let originalHtml = obj.innerHTML;
    obj.innerHTML = '<span style="color:#00ff00;">✅ COPIED TO CLIPBOARD!</span>';
    setTimeout(() => {
      obj.innerHTML = originalHtml;
    }, 2000);
  }
}
</script>

</body>
</html>
